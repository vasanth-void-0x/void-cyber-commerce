<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreatMart // Transmission Log (Cart)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/webp" href="/images/branding/threatmart-v-mark.webp">
<style>
  .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 32px; padding: 30px 0 60px; align-items: start; }
  @media (max-width: 760px) { .cart-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/index.html" class="brand">
      <img class="brand-logo" src="/images/branding/threatmart-v-mark.webp" alt="" width="44" height="44">
      <span class="brand-copy">ThreatMart<small>SIGNAL-INTERCEPT COMMERCE</small></span>
    </a>
    <nav class="nav">
      <a href="/index.html">Arsenal</a>
      <a href="/cart.html" class="nav-icon-link">Cart<span class="badge" id="cart-badge" style="display:none;">0</span></a>
      <span id="nav-auth"></span>
    </nav>
  </div>
</header>

<div class="shell">
  <div class="eyebrow" style="margin-top:28px;">Transmission Log</div>
  <h1 style="margin:8px 0 0;">Your cart</h1>

  <div class="cart-layout" id="cart-layout">
    <div class="panel"><div id="cart-items">Loading...</div></div>
    <div class="panel panel-raised">
      <div class="eyebrow">Summary</div>
      <div id="summary" style="margin-top:14px;"></div>
      <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:18px;">Proceed to checkout</button>
    </div>
  </div>
</div>

<footer>THREATMART — FOR AUTHORIZED SECURITY RESEARCH &amp; TESTING ONLY</footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
