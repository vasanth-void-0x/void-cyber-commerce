<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID // Command Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/index.html" class="brand">
      <span class="brand-mark">V0</span>
      <span>VOID<small>COMMAND CONSOLE</small></span>
    </a>
    <nav class="nav">
      <a href="/index.html">Storefront</a>
      <span id="nav-auth"></span>
    </nav>
  </div>
</header>

<div id="access-check" class="shell" style="padding-top:40px;"></div>

<div class="admin-shell" id="admin-shell" style="display:none;">
  <aside class="admin-sidebar">
    <div class="eyebrow">Console</div>
    <button class="admin-tab active" data-tab="stats">Overview</button>
    <button class="admin-tab" data-tab="products">Products</button>
    <button class="admin-tab" data-tab="orders">Orders</button>
    <button class="admin-tab" data-tab="users">Users</button>
  </aside>

  <main class="admin-main">
    <section class="tab-panel active" id="tab-stats">
      <h2>Overview</h2>
      <div class="stat-grid" id="stat-grid"></div>
    </section>

    <section class="tab-panel" id="tab-products">
      <div class="admin-panel-head">
        <h2>Products</h2>
        <button class="btn btn-primary btn-sm" id="new-product-btn">+ New device</button>
      </div>
      <div class="panel" id="product-form-panel" style="display:none; margin-bottom:24px;"></div>
      <div class="panel"><table class="admin-table" id="products-table"></table></div>
    </section>

    <section class="tab-panel" id="tab-orders">
      <h2>Orders</h2>
      <div class="panel"><table class="admin-table" id="orders-table"></table></div>
    </section>

    <section class="tab-panel" id="tab-users">
      <h2>Users</h2>
      <div class="panel"><table class="admin-table" id="users-table"></table></div>
    </section>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
