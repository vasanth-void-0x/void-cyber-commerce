<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreatMart // Access Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/webp" href="/images/branding/threatmart-v-mark.webp">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/index.html" class="brand">
      <img class="brand-logo" src="/images/branding/threatmart-v-mark.webp" alt="" width="44" height="44">
      <span class="brand-copy">ThreatMart<small>SIGNAL-INTERCEPT COMMERCE</small></span>
    </a>
    <nav class="nav"><span id="nav-auth"></span></nav>
  </div>
</header>

<div class="shell">
  <div class="panel form-narrow auth-panel">
    <div class="auth-brand"><img src="/images/branding/threatmart-logo.webp" alt="ThreatMart" width="260" height="275"></div>
    <div class="eyebrow">Access Terminal</div>
    <h1 style="margin:10px 0 20px;">Log in</h1>
    <div id="redirect-note" style="font-size:12px;color:var(--text-dim);margin-bottom:16px;"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div class="form-error" id="login-error"></div>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">Authenticate</button>
    </form>
    <div class="form-note">No account? <a href="/register.html">Register here</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth-login.js"></script>
</body>
</html>
