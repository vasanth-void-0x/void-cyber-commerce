<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreatMart // Authorize Transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/webp" href="/images/branding/threatmart-v-mark.webp">
<style>
  .checkout-layout { display: grid; grid-template-columns: 1fr 320px; gap: 32px; padding: 30px 0 60px; align-items: start; }
  @media (max-width: 760px) { .checkout-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/index.html" class="brand">
      <img class="brand-logo" src="/images/branding/threatmart-v-mark.webp" alt="" width="44" height="44">
      <span class="brand-copy">ThreatMart<small>SIGNAL-INTERCEPT COMMERCE</small></span>
    </a>
    <nav class="nav">
      <a href="/index.html">Arsenal</a>
      <a href="/cart.html" class="nav-icon-link">Cart<span class="badge" id="cart-badge" style="display:none;">0</span></a>
      <span id="nav-auth"></span>
    </nav>
  </div>
</header>

<div class="shell">
  <div class="eyebrow" style="margin-top:28px;">Authorize Transmission</div>
  <h1 style="margin:8px 0 0;">Checkout</h1>

  <div class="checkout-layout">
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:16px;">Delivery coordinates</div>
      <form id="checkout-form">
        <div class="field">
          <label for="ship-name">Recipient name</label>
          <input type="text" id="ship-name" required>
        </div>
        <div class="field">
          <label for="ship-address">Shipping address</label>
          <textarea id="ship-address" rows="4" required></textarea>
        </div>
        <div class="form-error" id="checkout-error"></div>
        <button class="btn btn-primary btn-block" type="submit" id="confirm-btn">Confirm order</button>
      </form>
    </div>
    <div class="panel panel-raised">
      <div class="eyebrow">Order summary</div>
      <div id="summary" style="margin-top:14px;">Loading...</div>
    </div>
  </div>
</div>

<footer>THREATMART — FOR AUTHORIZED SECURITY RESEARCH &amp; TESTING ONLY</footer>

<script src="/js/api.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
